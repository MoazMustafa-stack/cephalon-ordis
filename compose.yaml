name: cephalon-ordis
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ordis
      POSTGRES_USER: ordis
      POSTGRES_PASSWORD: ${ORDIS_POSTGRES_PASSWORD:?set ORDIS_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: E:/Cephalon-Ordis/data/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: E:/Cephalon-Ordis/code/db/migrations
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordis -d ordis"]
      interval: 5s
      timeout: 3s
      retries: 20

